sast-semgrep:
    name: 1. SAST (semgrep)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Instalar Semgrep
        run: pip install semgrep

      - name: Ejecutar Semgrep (SAST)
        run: semgrep scan --config auto --json --output semgrep.json .

      - name: Guardar artefacto semgrep.json
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sast-report
          path: semgrep.json

      # modo aviso no frena el pipeline
      - name: Quality Gate A (aviso)
        continue-on-error: true
        run: |
          HIGH=$(jq '[.results[] | select(.extra.severity == "ERROR")] | length' semgrep.json)
          echo "Hallazgos críticos/altos detectados por Semgrep: $HIGH"

          if [ "$HIGH" -ge 1 ]; then
            echo "::warning::QUALITY GATE A: se detectaron $HIGH hallazgos críticos/altos (modo aviso, el pipeline continúa)."
            exit 1
          fi

sca-dependency-check:
  name: 2. Análisis (SCA)
  runs-on: ubuntu-latest

  steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Dependency-Check
        uses: dependency-check/Dependency-Check_Action@main
        with:
          project: ${{ github.event.repository.name }}
          path: '.'
          format: 'ALL'          
          out: 'reports'
          args: >
            --nvdApiKey ${{ secrets.NVD_API_KEY }}

      - name: Subir informe a DefectDojo
        if: always()
        run: |
          curl --fail-with-body -X POST "${{ secrets.DOJO_URL }}/api/v2/import-scan/" \
            -H "Authorization: Token ${{ secrets.DOJO_TOKEN }}" \
            -F "scan_type=Dependency Check Scan" \
            -F "file=@reports/dependency-check-report.xml" \
            -F "product_name=${{ github.event.repository.name }}" \
            -F "engagement_name=CI-${{ github.ref_name }}" \
            -F "auto_create_context=true" \
            -F "active=true" \
            -F "verified=false" \
            -F "commit_hash=${{ github.sha }}" \
            -F "branch_tag=${{ github.ref_name }}" \
            -F "close_old_findings=true"

      - name: Guardar informe como artefacto
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-report
          path: reports
# =========================================================================
# STAGE 3: STAGING Y DAST (Solo escanea y sube el informe)
# =========================================================================
dast-zap:
    name: 3. Staging y DAST (OWASP ZAP)
    needs: [sast-semgrep, sca-dependency-check]
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:4.4
        ports:
          - 27017:27017
    steps:
      - uses: actions/checkout@v4

      - name: Desplegar NodeGoat en Staging
        run: |
          npm install --ignore-scripts
          MONGODB_URI="mongodb://localhost:27017/nodegoat" npm start &
          sleep 10
          chmod 777 ${{ github.workspace }}

      - name: Ejecutar OWASP ZAP (DAST)
        uses: zaproxy/action-full-scan@v0.10.0
        with:
          target: 'http://localhost:4000'
          cmd_options: '-x zap-report.xml'
          allow_issue_writing: false
          fail_action: false

      - name: Guardar informe zap-report.xml
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dast-report
          path: zap-report.xml

  # =========================================================================
  # STAGE 4: IMPORTAR LOS 3 INFORMES A DEFECTDOJO
  # =========================================================================
  import-defectdojo:
    name: 4. Importar resultados a DefectDojo
    needs: [sast-semgrep, sca-dependency-check, dast-zap]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: all-reports

      - name: Subir informes a DefectDojo vía API (reimport-scan)
        env:
          DOJO_URL: ${{ secrets.DOJO_URL }}
          DOJO_TOKEN: ${{ secrets.DOJO_TOKEN }}
          ENGAGEMENT_ID: ${{ secrets.DOJO_ENGAGEMENT_ID }}
        run: |
          for item in \
            "semgrep-report/semgrep-report.json|Semgrep JSON Report" \
            "sca-report/dependency-check-report.xml|Dependency Check Scan" \
            "dast-report/zap-report.xml|ZAP Scan"; do
            FILE="all-reports/${item%%|*}"
            TYPE="${item##*|}"
            if [ -f "$FILE" ]; then
              curl -f -s -X POST "$DOJO_URL/api/v2/reimport-scan/" \
                -H "Authorization: Token $DOJO_TOKEN" \
                -F "scan_type=$TYPE" \
                -F "engagement=$ENGAGEMENT_ID" \
                -F "scan_date=$(date +%Y-%m-%d)" \
                -F "active=true" \
                -F "file=@$FILE"
            fi
          done

  # =========================================================================
  # QUALITY GATE B: CONSULTA GLOBAL EN DEFECTDOJO (Bloqueante)
  # =========================================================================
  quality-gate-b:
    name: 5. Quality Gate B (DefectDojo)
    needs: [import-defectdojo]
    runs-on: ubuntu-latest
    steps:
      - name: Evaluar hallazgos Críticos/Altos activos en DefectDojo
        env:
          DOJO_URL: ${{ secrets.DOJO_URL }}
          DOJO_TOKEN: ${{ secrets.DOJO_TOKEN }}
          ENGAGEMENT_ID: ${{ secrets.DOJO_ENGAGEMENT_ID }}
        run: |
          # Espera breve para asegurar que DefectDojo termina de procesar y deduplicar
          sleep 5

          # Consulta a la API cuántos findings ACTIVOS y NO FALSOS POSITIVOS son Critical o High
          RESPONSE=$(curl -f -s -H "Authorization: Token $DOJO_TOKEN" \
            "$DOJO_URL/api/v2/findings/?test__engagement=$ENGAGEMENT_ID&active=true&false_p=false&severity__in=Critical,High&limit=1")

          COUNT=$(echo "$RESPONSE" | jq '.count')
          echo "Total de vulnerabilidades Críticas/Altas activas en DefectDojo (SAST + SCA + DAST): $COUNT"

          if [ "$COUNT" -ge 1 ]; then
            echo "::error::QUALITY GATE B BLOQUEADO: DefectDojo reporta $COUNT vulnerabilidades críticas o altas activas."
            exit 1
          fi

  # =========================================================================
  # STAGE 6: PRODUCCIÓN (Solo si DefectDojo aprueba el Gate B)
  # =========================================================================
  deploy-production:
    name: 6. Despliegue a Producción
    needs: [quality-gate-b]
    if: success() && github.ref == 'refs/heads/main'
    environment: production
    runs-on: ubuntu-latest
    steps:
      - name: Desplegar versión aprobada en Producción
        run: echo "Quality Gate B superado en DefectDojo. Desplegando en producción..."