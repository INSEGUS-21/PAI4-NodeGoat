dast-zap:
    name: 3. Staging y DAST (OWASP ZAP)
    needs: [sast-semgrep, sca-dependency-check]
    runs-on: ubuntu-latest
    # GitHub levanta MongoDB automáticamente como servicio
    services:
      mongo:
        image: mongo:4.4
        ports:
          - 27017:27017
    steps:
      - uses: actions/checkout@v4

      - name: Desplegar NodeGoat en Staging
        run: |
          npm install --ignore-scripts
          MONGODB_URI="mongodb://localhost:27017/nodegoat" npm start &
          sleep 10
          chmod 777 ${{ github.workspace }}

      - name: Ejecutar OWASP ZAP (DAST)
        uses: zaproxy/action-full-scan@v0.10.0
        with:
          target: 'http://localhost:4000'
          cmd_options: '-x zap-report.xml'
          allow_issue_writing: false
          fail_action: false

      - name: Guardar informe zap-report.xml
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dast-report
          path: zap-report.xml

      - name: Quality Gate B (Bloqueante >= 1 crítica/alta)
        run: |
          HIGH=$(grep -c "<riskcode>3</riskcode>" zap-report.xml || true)
          echo "Vulnerabilidades altas/críticas: $HIGH"
          [ "$HIGH" -ge 1 ] && exit 1

  import-defectdojo:
    name: 4. Importar resultados a DefectDojo
    needs: [sast-semgrep, sca-dependency-check, dast-zap]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: all-reports

      - name: Subir informes a DefectDojo vía API
        env:
          DOJO_URL: ${{ secrets.DOJO_URL }}
          DOJO_TOKEN: ${{ secrets.DOJO_TOKEN }}
          ENGAGEMENT_ID: ${{ secrets.DOJO_ENGAGEMENT_ID }}
        run: |
          for item in \
            "semgrep-report/semgrep-report.json|Semgrep JSON Report" \
            "sca-report/dependency-check-report.xml|Dependency Check Scan" \
            "dast-report/zap-report.xml|ZAP Scan"; do
            FILE="all-reports/${item%%|*}"
            TYPE="${item##*|}"
            if [ -f "$FILE" ]; then
              curl -f -s -X POST "$DOJO_URL/api/v2/reimport-scan/" \
                -H "Authorization: Token $DOJO_TOKEN" \
                -F "scan_type=$TYPE" \
                -F "engagement=$ENGAGEMENT_ID" \
                -F "scan_date=$(date +%Y-%m-%d)" \
                -F "active=true" \
                -F "file=@$FILE"
            fi
          done
